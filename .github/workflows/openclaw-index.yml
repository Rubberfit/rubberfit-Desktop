# Re-indexes this repo into the OpenClaw Cloudflare Vectorize store on
# every push to `dev` (active development) or `main` (customer-facing
# release). The bot's retrieval reflects whichever branch most recently
# changed — both reindex into the same namespace (lowercased repo name)
# so the latest push wins. That matches how OpenClaw is supposed to read
# this repo: developers push dev as they work, main lags behind.
#
# Implementation lives at
# Arc-and-Anchor/openclaw-worker/.github/workflows/codebase-index.yml.
# This file just calls it via `uses:` so the indexer logic stays in one
# place across the org.
#
# Required org-level secrets (set once at
# https://github.com/organizations/Arc-and-Anchor/settings/secrets/actions
# with access granted to all repos that need to index):
#   - CLOUDFLARE_ACCOUNT_ID
#   - CLOUDFLARE_AI_TOKEN     (Workers AI Read + Vectorize Edit)
#   - OPENCLAW_REPO_TOKEN     (fine-grained PAT, Contents:Read on
#                              Arc-and-Anchor/openclaw-worker — required
#                              because the runner's default GITHUB_TOKEN
#                              can't clone the private indexer source)

name: OpenClaw codebase index

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  index:
    uses: Arc-and-Anchor/openclaw-worker/.github/workflows/codebase-index.yml@main
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      OPENCLAW_REPO_TOKEN: ${{ secrets.OPENCLAW_REPO_TOKEN }}
