<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RubberFit</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      .card {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        background: #1f2937;
        color: #f3f4f6;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
      }

      .logo {
        width: 160px;
        height: 160px;
        image-rendering: -webkit-optimize-contrast;
      }

      .wordmark {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(243, 244, 246, 0.2);
        border-top-color: #f3f4f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="splash-logo.png" alt="" />
      <div class="wordmark">RubberFit</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </body>
</html>
