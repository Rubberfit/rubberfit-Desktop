# Workspace root — wires the Tauri app crate (`src-tauri`) together with
# the Rust packing engine crates (`rf-geom`, `rf-layout`) that were
# ported from the rema-portal `engine/` workspace in Phase 1.
#
# Only the two engine crates needed by the Tauri command layer are
# members here — `pack-cli`, `rf-domain`, `rf-application`, `rf-api`,
# and `rf-supabase` intentionally stayed behind in rema-portal.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/rf-geom", "crates/rf-layout"]

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# jagua-rs 0.7.1 has two over-aggressive internal debug_asserts that
# fire on legitimate inputs:
#
# 1. `collision_detection/quadtree/qt_hazard.rs:111` — asserts that a
#    `Partial` hazard spanning multiple quadrants must produce at least
#    one child quadrant with colliding edges. Fires when a hazard
#    polygon fully SURROUNDS a child quadrant with zero edge crossings
#    (common in clearance-inflated tight-bin fixtures where rect edges
#    lie outside deeper child quadrants the rect interior fully covers).
#    Downstream neighbor-inference at qt_hazard.rs:116-163 already handles
#    the zero-edge-colliding case correctly via centroid containment.
#
# 2. `probs/bpp/util/assertions.rs:11` — `assert_eq!(bpp.density(),
#    sol.density(...))` panics with `NaN != NaN` when LBF places zero
#    items (both sides compute `0/0`). Surfaces when the wall-flush
#    bin expansion shrinks an item's valid centroid region small enough
#    that LBF's probabilistic sampler can't find any position. Without
#    this override, the AutoNest "Rect warm-start" toggle being
#    unchecked on a near-bin-size rectangle fixture (R6) crashes the
#    Tauri runtime.
#
# Release builds strip debug_asserts — production unaffected. The
# overrides are the only current fix until upstream ships patches.
#
# (Ported verbatim from rema-portal/engine/Cargo.toml; #2 added 2026-04-26.)
[profile.test.package.jagua-rs]
debug-assertions = false

[profile.dev.package.jagua-rs]
debug-assertions = false

# Compile every external dependency (jagua-rs, clipper2, geo, lbf, …)
# at full release optimization in dev builds. `npm run tauri dev`
# defaults to debug, and unoptimized math-heavy code (CDE, polygon
# Boolean ops) runs 10–100× slower than release — a ~4 s release-mode
# cone pack becomes minutes in stock dev. The wildcard rule composes
# with the `jagua-rs` block above (debug-assertions stays off).
#
# IMPORTANT: per the Cargo Reference, `package."*"` does NOT match
# workspace members. The local engine crates below get their own
# explicit overrides — without them, our LBF/LNS wrapper, scrap
# extraction, and polygon math still run at unoptimized debug speed
# even though jagua-rs is fast.
[profile.dev.package."*"]
opt-level = 3

# Local engine crates: explicit overrides because `package."*"` skips
# workspace members. opt-level = 3 because runtime speed (pack
# wall-clock) matters more than incremental compile speed for the
# current workflow — most edits are TS/TSX, Rust changes are rare.
# Drop to opt-level = 1 if Rust iteration becomes painful.
[profile.dev.package.rf-geom]
opt-level = 3

[profile.dev.package.rf-layout]
opt-level = 3
