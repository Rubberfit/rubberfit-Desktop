[package]
name = "rubberfit-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["Steven Fojas", "Daniel Martinez Julio", "Alex Yamasaki"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rubberfit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tokio is needed so `#[tauri::command] async fn pack_job` can offload
# the synchronous, CPU-bound rf-layout pipeline via `spawn_blocking`
# without blocking the Tauri runtime's main worker threads.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# In-process packing engine. Ported from rema-portal/engine in Phase 1.
# Replaces the pack-cli subprocess spawn used by the web portal — the
# desktop build links rf-layout directly and calls it via tokio
# `spawn_blocking` from the `pack_job` command.
rf-layout = { path = "../crates/rf-layout" }

